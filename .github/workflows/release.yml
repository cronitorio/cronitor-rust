name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v prefix (e.g. 1.0.0)"
        required: true
        type: string

permissions:
  contents: write # create the release tag on workflow_dispatch

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve version
        id: version
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "Version ${version} is not MAJOR.MINOR.PATCH"; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Check version matches Cargo.toml
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          [ "${{ steps.version.outputs.version }}" = "${version}" ] \
            || { echo "Requested ${{ steps.version.outputs.version }} but Cargo.toml has ${version}"; exit 1; }
      - name: Run Tests
        run: cargo test --locked
      - name: Create release tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "${tag}" >/dev/null; then
            echo "Tag ${tag} already exists"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "Release ${tag}"
          git push origin "${tag}"
      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
